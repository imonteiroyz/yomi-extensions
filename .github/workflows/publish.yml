name: Publish

# Manual only: every run builds every patch in patches/, signs it, releases it and
# rewrites the repo branch. There is no schedule and no build on push.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Require the signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Without the keystore the upstream build falls back to the debug key; never publish that.
          for name in SIGNING_KEY ALIAS KEY_STORE_PASSWORD KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is missing; refusing to build with the debug key"
              exit 1
            fi
          done

      - name: Check out this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: yomi

      - name: Read the pinned upstream commit
        id: upstream
        run: echo "sha=$(tr -d '[:space:]' < yomi/upstream-commit.txt)" >> "$GITHUB_OUTPUT"

      - name: Check out keiyoushi/extensions-source at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: keiyoushi/extensions-source
          ref: ${{ steps.upstream.outputs.sha }}
          path: upstream
          persist-credentials: false

      - name: Pick the next version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Releases are tagged v1, v2, ...; the next publication takes the next number, which is
          # also every extension's versionCode. A failed run never creates a release, so it uses no number.
          last=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName \
            --jq '[.[].tagName | select(test("^v[0-9]+$")) | ltrimstr("v") | tonumber] | max // 0')
          # This repo was recreated on 2026-10-12 after v1-v3 had been installed in the apps, so numbering
          # resumes above them: a lower versionCode would never be offered as an update.
          [ "$last" -ge 3 ] || last=3
          echo "number=$((last + 1))" >> "$GITHUB_OUTPUT"

      - name: Apply patches and load only the patched extensions
        id: modules
        env:
          VERSION_CODE: ${{ steps.version.outputs.number }}
        run: |
          modules=()
          for patch in yomi/patches/*.patch; do
            git -C upstream apply --verbose "../$patch"
            # patches/<lang>.<extension>.patch patches src/<lang>/<extension>
            lang_ext=$(basename "$patch" .patch)
            lang=${lang_ext%%.*}
            ext=${lang_ext#*.}
            build_file="upstream/src/$lang/$ext/build.gradle.kts"
            sed -i "s/^\(\s*\)versionCode = .*/\1versionCode = $VERSION_CODE/" "$build_file"
            grep -q "^\s*versionCode = $VERSION_CODE$" "$build_file" || { echo "::error::could not set versionCode in $build_file"; exit 1; }
            modules+=(":src:$lang:$ext")
            loads+="loadIndividualExtension(\"$lang\", \"$ext\")\n"
          done
          # core, compiler, common, lib and lib-multisrc stay; only the extension list shrinks.
          grep -q "^loadAllIndividualExtensions()$" upstream/settings.gradle.kts \
            || { echo "::error::settings.gradle.kts no longer calls loadAllIndividualExtensions(); update this step"; exit 1; }
          sed -i "s/^loadAllIndividualExtensions()$/$loads/" upstream/settings.gradle.kts
          echo "tasks=${modules[*]/%/:assembleRelease}" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 25
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build and sign
        working-directory: upstream
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          TASKS: ${{ steps.modules.outputs.tasks }}
        run: |
          echo "$SIGNING_KEY" | base64 -d > signingkey.jks
          ./gradlew $TASKS

      - name: Check every APK and JAR is signed with the keystore
        id: fingerprint
        working-directory: upstream
        env:
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        run: |
          expected=$(keytool -exportcert -alias "$ALIAS" -keystore signingkey.jks -storepass "$KEY_STORE_PASSWORD" | sha256sum | cut -d' ' -f1)
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          for apk in src/*/*/build/outputs/apk/release/*.apk; do
            certs=$("$apksigner" verify --print-certs "$apk")
            # "Signer #1 certificate SHA-256 digest: ..." in older build-tools, "V2 Signer: certificate SHA-256 digest: ..." in 37
            actual=$(echo "$certs" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1)
            [ "$actual" = "$expected" ] || { echo "$certs"; echo "::error::$apk is signed with '$actual', expected $expected"; exit 1; }
          done
          for jar in src/*/*/build/outputs/jar/release/*.jar; do
            actual=$(keytool -printcert -jarfile "$jar" | sed -n 's/^\s*SHA256: //p' | head -n 1 | tr -d ':' | tr 'A-F' 'a-f')
            [ "$actual" = "$expected" ] || { echo "::error::$jar is signed with $actual, expected $expected"; exit 1; }
          done
          echo "sha256=$expected" >> "$GITHUB_OUTPUT"

      - name: Release and write the repo files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.number }}
          FINGERPRINT: ${{ steps.fingerprint.outputs.sha256 }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          pip install protobuf
          python yomi/scripts/publish.py upstream site \
            --tag "$TAG" --fingerprint "$FINGERPRINT" --repo "$GITHUB_REPOSITORY" --upstream-sha "$UPSTREAM_SHA"

      - name: Push the repo branch
        working-directory: yomi
        env:
          TAG: v${{ steps.version.outputs.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth 1 origin repo; then
            git checkout -B repo FETCH_HEAD
          else
            git checkout --orphan repo
          fi
          git rm -rqf --ignore-unmatch .
          cp ../site/index.pb ../site/index.json ../site/repo.json .
          git add index.pb index.json repo.json
          git diff --cached --quiet || git commit -m "Publish $TAG"
          git push origin repo

      - name: Clean up the keystore
        if: always()
        run: rm -f upstream/signingkey.jks
